# ==========================================
# DEV 프로파일 - H2 내장 DB (개발/테스트용)
# ==========================================
spring:
  datasource:
    url: jdbc:h2:file:/opt/lter/infra/h2db/lter_infra;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.lter.infra: DEBUG 
  file:
    name: /var/log/lter-infra/app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      file-name-pattern: /var/log/lter-infra/app-%d{yyyy-MM-dd}.%i.log
