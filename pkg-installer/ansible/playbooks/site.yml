---
# 진입 플레이북. backend(pkg-installer-backend)가 extravars(os_target/profile/options)와
# target_hosts 를 주입해 ansible-runner 로 구동한다. role 순서 = install-stages.md.
- name: PKG init/install provisioning (air-gapped)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  vars:
    os_target: "{{ os_target | default(group_names[0]) }}"
    profile: "{{ profile | default('base') }}"
    fail_fast: "{{ fail_fast | default(true) }}"
    reboot_allowed: "{{ reboot_allowed | default(false) }}"
  roles:
    - { role: common,       tags: [stage_preflight] }
    - { role: offline_repo, tags: [stage_offline_repo] }
    - { role: kernel,       tags: [stage_kernel] }
    - { role: packages,     tags: [stage_packages] }
    - { role: config,       tags: [stage_config] }
    - { role: validate,     tags: [stage_validate] }
