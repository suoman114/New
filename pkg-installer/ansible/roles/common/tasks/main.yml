---
# stage: preflight  (담당: pkg-ansible)
# SSH 도달은 ansible 연결 자체로 검증됨. 아래는 전제조건 assert.
- name: Gather minimal facts
  ansible.builtin.setup:
    gather_subset: ["hardware", "distribution"]
  tags: [stage_preflight]

- name: Assert supported OS (centos7|rhel8)
  ansible.builtin.assert:
    that:
      - ansible_distribution_major_version in ['7', '8']
    fail_msg: "지원하지 않는 OS: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
  tags: [stage_preflight]

- name: Assert minimum memory
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb | int >= (min_mem_mb | int)
    fail_msg: "메모리 부족: {{ ansible_memtotal_mb }}MB < {{ min_mem_mb }}MB"
  tags: [stage_preflight]

# TODO(pkg-ansible): 디스크 여유, offline 미러 연결성(repoquery), require_offline_only assert 추가.
