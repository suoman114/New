---
# 공통 변수 (config/installer.yaml 의 offline/policy 와 정합)
offline:
  repo_name: offline
  baseurl: "file:///opt/offline-bundle/repo"
  gpgkey: "file:///opt/offline-bundle/gpg/RPM-GPG-KEY"
  bundle_path: "/opt/offline-bundle"

require_offline_only: true
fail_fast: true
reboot_allowed: false

min_disk_gb: 5
min_mem_mb: 1024
