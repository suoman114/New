[project]
name = "pkg-installer-backend"
version = "0.1.0"
description = "Air-gapped PKG init/install automation — dashboard backend + ansible orchestration"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "ansible-runner",
    "pyyaml",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
    "httpx",
]
pdf = ["weasyprint"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["installer", "api"]
